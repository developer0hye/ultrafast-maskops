name: Wheel compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      inspect_artifact:
        description: Existing maskops artifact ID to inspect instead of building wheels
        type: string
        default: ''
      inspect_run:
        description: Run ID that must own the artifact
        type: string
        default: ''
      sdist_only:
        description: Validate a source-only wheel rebuild on Linux Python 3.12
        type: boolean
        default: false
      windows_reset:
        description: Diagnose reset lifecycle using the original failed Windows 3.13 wheel
        type: boolean
        default: false
      reset_probe:
        description: Natural reproduction or a deliberately slow initialization control
        type: choice
        options: [natural, deadline]
        default: natural

permissions:
  contents: read

jobs:
  windows-reset:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_reset && !inputs.sdist_only && inputs.inspect_artifact == ''
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      YOLO_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Retrieve exact failed wheel and original receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bench/prepare_windows_reset_wheel.py
      - name: Install original wheel and pinned framework
        id: runtime
        run: |
          python -m venv probe-env
          echo "$PWD/probe-env/Scripts" >> "$GITHUB_PATH"
          probe-env/Scripts/python -m pip install numpy==2.4.4 pytest==9.1.1
          probe-env/Scripts/python -m pip install --no-deps reset-evidence/wheel-input/*.whl
          probe-env/Scripts/python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          probe-env/Scripts/python -m pip install numpy==2.4.4 pillow==12.1.1 opencv-python==4.13.0.92 pi-heif==1.4.0 https://github.com/ultralytics/ultralytics/archive/795a556942a12fe0124cf767888194a1d0b83e2e.tar.gz
          probe-env/Scripts/python -m pip freeze > reset-evidence/diagnostic-environment.txt
          probe-env/Scripts/python - <<'PYTHON'
          import json, sys, sysconfig
          from pathlib import Path
          sys.path.insert(0, 'bench')
          from audit_wheel import audit
          wheel = next(Path('reset-evidence/wheel-input').glob('*.whl'))
          result = audit(wheel, Path(sysconfig.get_path('platlib')))
          Path('reset-evidence/installed-wheel.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          assert result['clean'], result['errors']
          PYTHON
      - name: Run all 27 predeclared diagnostic cases without retries
        if: inputs.reset_probe == 'natural'
        run: python bench/windows_reset_probe.py
      - name: Diagnose the unchanged join deadline with six initialization controls
        if: inputs.reset_probe == 'deadline'
        run: python bench/windows_reset_deadline.py
      - name: Repeat complete integration suite with exit-code context
        if: always() && steps.runtime.outcome == 'success' && inputs.reset_probe == 'natural'
        run: python -m pytest -q tests/test_integration.py tests/test_training.py tests/test_persistent_format.py tests/test_shared_collate.py --junitxml=reset-evidence/integration-tests.xml
      - name: Preserve diagnostic evidence including every failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-reset-diagnostic
          path: reset-evidence/
          if-no-files-found: error
          retention-days: 14
  sdist-rebuild:
    if: github.event_name == 'workflow_dispatch' && inputs.sdist_only && !inputs.windows_reset && inputs.inspect_artifact == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OMP_NUM_THREADS: '1'
      YOLO_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install source build dependencies
        run: |
          python -m pip install build==1.3.0 scikit-build-core==0.11.6 pybind11==3.0.1 ninja==1.13.2 numpy==2.4.4
          cmake --version
      - name: Build and inspect source distribution
        id: unpack
        run: |
          mkdir sdist-evidence
          git rev-parse HEAD > sdist-evidence/source-commit.txt
          python -m build --sdist --no-isolation
          python bench/inspect_sdist.py --checkout . --archive dist/ultrafast_maskops-0.1.0a1.tar.gz --destination "$RUNNER_TEMP/sdist-rebuild" --report sdist-evidence/source-inspection.json
      - name: Build wheel using only unpacked source
        working-directory: ${{ steps.unpack.outputs.source }}
        run: python -m build --wheel --no-isolation
      - name: Create clean installed runtime
        run: |
          python -m venv "$RUNNER_TEMP/sdist-runtime"
          echo "$RUNNER_TEMP/sdist-runtime/bin" >> "$GITHUB_PATH"
      - name: Audit installed source-built wheel and run core tests
        working-directory: ${{ steps.unpack.outputs.source }}
        run: |
          python -m pip install numpy==2.4.4
          python -m pip install --no-deps dist/*.whl
          python bench/ci_wheel_check.py
          python -m pip install pytest==9.1.1 opencv-python==4.13.0.92 numpy==2.4.4
          python -m pytest -q tests/test_parity.py tests/test_resize_roi.py tests/test_gpu_series_audit.py tests/test_lifecycle_coordinator.py tests/test_lifecycle_gpu_audit.py --junitxml=dist/core-tests.xml
          python -m pip freeze > dist/final-environment.txt
      - name: Collect source rebuild artifacts
        if: always()
        env:
          SDIST_SOURCE: ${{ steps.unpack.outputs.source }}
        run: |
          mkdir -p sdist-evidence
          if [ -d dist ]; then
            cp -a dist sdist-evidence/original-dist
          fi
          if [ -n "$SDIST_SOURCE" ] && [ -d "$SDIST_SOURCE/dist" ]; then
            cp -a "$SDIST_SOURCE/dist" sdist-evidence/rebuilt
          fi
      - name: Preserve source rebuild evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist-rebuild
          path: sdist-evidence/
          if-no-files-found: error
          retention-days: 14
  inspect-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_artifact != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect original archive and retain small receipts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.inspect_artifact }}
          RUN_ID: ${{ inputs.inspect_run }}
        run: python bench/inspect_hosted_artifact.py --repository "$REPOSITORY" --artifact-id "$ARTIFACT_ID" --run-id "$RUN_ID" --out artifact-inspection
      - name: Preserve artifact inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-inspection
          path: artifact-inspection/
          if-no-files-found: error
          retention-days: 14
  wheel:
    if: github.event_name != 'workflow_dispatch' || (inputs.inspect_artifact == '' && !inputs.sdist_only && !inputs.windows_reset)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      OMP_NUM_THREADS: '1'
      YOLO_OFFLINE: 'true'
      NUMPY_VERSION: ${{ matrix.python == '3.10' && '2.2.6' || '2.4.4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build dependencies
        run: |
          python -m pip install build==1.3.0 scikit-build-core==0.11.6 pybind11==3.0.1 ninja==1.13.2 "numpy==$NUMPY_VERSION"
          cmake --version
          python -c "import platform; assert platform.machine().lower() in ('arm64', 'aarch64') if platform.system() == 'Darwin' else platform.machine().lower() in ('amd64', 'x86_64')"
      - name: Build wheel and source archive
        run: python -m build --wheel --sdist --no-isolation
      - name: Create isolated runtime environment
        run: |
          python -m venv wheel-env
          python - <<'PY'
          import os
          from pathlib import Path
          scripts = (Path('wheel-env') / ('Scripts' if os.name == 'nt' else 'bin')).resolve()
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(scripts) + '\n')
          PY
      - name: Install and audit wheel
        run: |
          python -m pip install "numpy==$NUMPY_VERSION"
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python bench/ci_wheel_check.py
      - name: Core parity
        run: |
          python -m pip install pytest==9.1.1 opencv-python==4.13.0.92 "numpy==$NUMPY_VERSION"
          python -m pytest -q tests/test_parity.py tests/test_resize_roi.py tests/test_gpu_series_audit.py tests/test_lifecycle_coordinator.py tests/test_lifecycle_gpu_audit.py --junitxml=dist/core-tests.xml
      - name: CPU Torch dependencies
        if: matrix.python != '3.10' && runner.os != 'macOS'
        run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - name: macOS Torch dependencies
        if: matrix.python != '3.10' && runner.os == 'macOS'
        run: python -m pip install torch==2.10.0 torchvision==0.25.0
      - name: Pinned framework integration
        if: matrix.python != '3.10'
        run: |
          python -m pip install numpy==2.4.4 pillow==12.1.1 opencv-python==4.13.0.92 pi-heif==1.4.0 https://github.com/ultralytics/ultralytics/archive/795a556942a12fe0124cf767888194a1d0b83e2e.tar.gz
          python -m pytest -q tests/test_integration.py tests/test_training.py tests/test_persistent_format.py tests/test_shared_collate.py --junitxml=dist/integration-tests.xml
      - name: Record final Python environment
        if: always()
        run: |
          mkdir -p dist
          python -m pip freeze > dist/final-environment.txt
      - name: Preserve all artifacts and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maskops-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
