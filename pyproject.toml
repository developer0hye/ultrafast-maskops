[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ultrafast-maskops"
version = "0.1.0a1"
description = "Exact, dependency-free native replacements for the Ultralytics segmentation mask and geometry code"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3"]
license = "AGPL-3.0-only"

[tool.scikit-build]
wheel.packages = ["python/ultrafast_maskops"]
cmake.build-type = "Release"
sdist.exclude = ["bench/results/*.tar.gz*", "bench/results/*.zip"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["tests/reference.py", "docs/PRD.md"]

[tool.ruff.lint.per-file-ignores]
"bench/*.py" = ["E402"]
