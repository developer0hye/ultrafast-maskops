[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ultrafast-maskops"
version = "0.1.0a1"
description = "Batched OpenCV polygon rasterization with explicit Ultralytics parity"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3"]
license = "AGPL-3.0-or-later"

[tool.scikit-build]
wheel.packages = ["python/ultrafast_maskops"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
